[package]
name = "immich-sdk"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
progenitor-client = "0.14"
regress = "0.11"
reqwest = { version = "0.13", features = ["json", "query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }

[build-dependencies]
prettyplease = "0.2"
progenitor = { version = "0.14", default-features = false }
serde_json = "1"
syn = "2"
