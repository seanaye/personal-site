# fly.toml app configuration file for personal-site
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'personal-site-astvuq'
primary_region = 'yyz'

[build]

[deploy]
  strategy = 'canary'

[env]
  SITE_ROOT = 'site'
  HOST = '0.0.0.0'
  PORT = '8080'
  RUST_LOG = 'info'

[http_service]
  auto_start_machines = true
  auto_stop_machines = 'suspend'
  force_https = true
  internal_port = 8080
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
