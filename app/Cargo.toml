[package]
name = "app"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
topcoat.workspace = true
http.workspace = true
liquid = { path = "../liquid" }
photogrid = { path = "../photogrid" }
grid = { path = "../grid" }
photo-search = { path = "../photo-search" }
url = "2.5.2"
pulldown-cmark = "0.12"
rand = "0.8.5"

[dev-dependencies]
tokio.workspace = true

[build-dependencies]
topcoat = { git = "https://github.com/seanaye/topcoat", rev = "9a039d010e9fd75ba4f33ef2ed60ea8c04b79a77", default-features = false, features = ["tailwind"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
