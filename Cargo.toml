[workspace]
resolver = "2"
members = ["app", "frontend", "server", "grid", "liquid", "photogrid", "photo-search", "list-bucket", "images", "immich-sdk", "dumbpipe-client"]

# Keep release binaries and the browser WASM bundle small.
[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'

[workspace.dependencies]
topcoat = { version = "0.11.0", default-features = false, features = [
  "asset",
  "fs",
  "router",
  "serve",
  "tailwind",
  "view",
] }

console_error_panic_hook = "0.1.7"
console_log = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
log = "0.4.20"
simple_logger = "4.2.0"
thiserror = "1"
tokio = { version = "1.33.0", features = ["full"] }
wasm-bindgen = "0.2.97"
