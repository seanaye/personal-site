[workspace]
resolver = "2"
members = [
  "app",
  "frontend",
  "server",
  "grid",
  "liquid",
  "photogrid",
  "photo-search",
  "list-bucket",
  "images",
  "immich-sdk",
  "dumbpipe-client",
]

# Keep release binaries and the browser WASM bundle small.
[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'

[workspace.dependencies]
# seanaye/feat/generic-pages; keep the CLI pin in flake.nix and Dockerfile in sync.
topcoat = { git = "https://github.com/seanaye/topcoat", rev = "9a039d010e9fd75ba4f33ef2ed60ea8c04b79a77", default-features = false, features = [
  "asset",
  "fs",
  "router",
  "serve",
  "tailwind",
  "view",
] }
tracing = "0.1"
console_error_panic_hook = "0.1.7"
console_log = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
log = "0.4.20"
rootcause = "0.13"
# Keep S3 clients on rustls across the workspace; default features enable OpenSSL.
rust-s3 = { version = "0.37", default-features = false, features = [
  "tokio-rustls-tls",
  "fail-on-err",
  "tags",
] }
simple_logger = "4.2.0"
thiserror = "1"
tokio = { version = "1.33.0", features = ["full"] }
wasm-bindgen = "0.2.97"
